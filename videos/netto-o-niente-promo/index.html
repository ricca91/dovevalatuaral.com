    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.35, ease: "power3.in" }, 3.75);
        tl.fromTo("#el-02-title", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power3.out" }, 3.75);
        tl.to("#el-02-title", { y: -1920, duration: 0.4, ease: "power3.inOut" }, 7.5);
        tl.fromTo("#el-03-scelta", { y: 1920, opacity: 1 }, { y: 0, duration: 0.4, ease: "power3.inOut" }, 7.5);
        tl.to("#el-03-scelta", { scaleX: 0, transformOrigin: "left center", duration: 0.4, ease: "power3.inOut" }, 13.125);
        tl.fromTo("#el-04-serie", { scaleX: 0, transformOrigin: "right center", opacity: 1 }, { scaleX: 1, transformOrigin: "right center", duration: 0.4, ease: "power3.inOut" }, 13.125);
        tl.to("#el-05-trappola", { x: -1080, duration: 0.4, ease: "power3.inOut" }, 22.5);
        tl.fromTo("#el-06-sfida", { x: 1080, opacity: 1 }, { x: 0, duration: 0.4, ease: "power3.inOut" }, 22.5);
        tl.to("#el-06-sfida", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.35, ease: "power3.in" }, 26.25);
        tl.fromTo("#el-07-cta", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power3.out" }, 26.25);
        tl.to({}, { duration: 30 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
